<!-- https://jamiestunes.com/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>jamiestunes.com - Home</title>
    <style>
        body {
            margin: 0;
            background: #121212;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        #header-slot {
            width: 100%;
            background: #121212;
        }
        .main-layout {
            display: flex;
            flex: 1;
            background: #121212;
        }
        #sidebar-slot {
            flex-shrink: 0;
            background: #121212;
        }
        .content-area {
            flex-grow: 1;
            padding: 40px;
            background: #121212;
        }
        #footer-slot {
            width: 100%;
            background: #121212;
        }
    </style>
</head>
<body>

    <!-- Header Slot -->
    <div id="header-slot"></div>

    <div class="main-layout">
        <!-- Sidebar Slot -->
        <div id="sidebar-slot"></div>

        <!-- Main Content Area -->
        <div class="content-area">
            <h1>Welcome to jamiestunes.com</h1>
            <p>Explore live concert video archives and musical performances.</p>
        </div>
    </div>

    <!-- Footer Slot -->
    <div id="footer-slot"></div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Fetch and insert header
            fetch('index-header.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('header-slot').innerHTML = data;
                })
                .catch(error => console.error('Error loading header:', error));

            // Fetch and insert sidebar
            fetch('index-sidebar.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('sidebar-slot').innerHTML = data;
                })
                .catch(error => console.error('Error loading sidebar:', error));

            // Fetch and insert footer
            fetch('index-footer.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('footer-slot').innerHTML = data;
                    const scripts = document.getElementById('footer-slot').querySelectorAll('script');
                    scripts.forEach(script => {
                        const newScript = document.createElement('script');
                        newScript.text = script.innerHTML;
                        document.body.appendChild(newScript);
                    });
                })
                .catch(error => console.error('Error loading footer:', error));
        });
    </script>
</body>
</html>

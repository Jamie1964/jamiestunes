<!-- https://jamiestunes.com/sidewalk/dovydas/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Dovydas - jamiestunes.com -->
<title>jamiestunes.com - Dovydas</title>
<style>
body {margin: 0; background: #121212; color: #fff; font-family: sans-serif; display: flex; min-height: 100vh; }
#sidebar-slot {flex-shrink: 0; background: #121212; display: flex; }
.main-wrapper {display: flex; flex-direction: column; flex-grow: 1; background: #121212; }
#header-slot {width: 100%; background: #121212; }
.content-area {flex-grow: 1; padding: 40px; background: #121212; text-align: center; }
.content-area h1 {color: #1e90ff; }
.artist-section {margin: 40px auto; max-width: 600px; }
.artist-section img {width: 640px; max-width: 100%; height: auto; border-radius: 8px; display: block; margin: 0 auto 15px auto; }
.artist-section h2 {color: gold; font-size: 28px; margin: 0; }
.video-container {position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; max-width: 100%; background: #000; margin: 15px auto 0 auto; border-radius: 8px; }
.video-container iframe {position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
#footer {width: 100%; background: #121212; }
</style>
</head>
<body>

<!-- Sidebar Slot -->
<div id="sidebar-slot"></div>

<!-- Main Wrapper holding Header, Content, and Footer -->
<div class="main-wrapper">

<!-- Header Slot -->
<div id="header-slot"></div>

<!-- Main Content Area -->
<div class="content-area">
<h1>Dovydas</h1>

<div class="artist-section">
<img src="https://jamiestunes.com/images/dovydas-banner.jpg" alt="Dovydas">
<h2>Dovydas</h2>

<hr style="border: 0; border-top: 1px solid #333; margin: 30px auto; max-width: 400px;">

<div class="video-container">
<iframe width="560" height="315" src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</div>
<h2 style="color: gold; font-size: 28px; margin-top: 15px;">Live Street Performance</h2>
</div>

</div>

<!-- Footer Slot -->
<div id="footer"></div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
// Fetch and insert sidebar
fetch('../sidewalk-sidebar.html')
.then(response => response.text())
.then(data => {document.getElementById('sidebar-slot').innerHTML = data;})
.catch(error => console.error('Error loading sidebar:', error));

// Fetch and insert header
fetch('../sidewalk-header.html')
.then(response => response.text())
.then(data => {document.getElementById('header-slot').innerHTML = data;})
.catch(error => console.error('Error loading header:', error));

// Fetch and insert footer, then execute counter logic
fetch('../sidewalk-footer.html')
.then(r => r.text())
.then(html => {
document.getElementById('footer').innerHTML = html;

// NOW the footer exists — safe to run the counter
const domain = window.location.hostname.replace(/\./g, "_");
const page = window.location.pathname.replace(/\//g, "_") || "home";
const counterKey = "pv_" + domain + "_" + page;

let views = localStorage.getItem(counterKey);
views = views ? parseInt(views) + 1 : 1;
localStorage.setItem(counterKey, views);

document.getElementById("viewCounter").innerText = "Views: " + views;
})
.catch(err => console.error("Footer failed to load:", err));
});
</script>

</body>
</html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>jamiestunes.com - Ruebengotxi</title>
<style>
body {
    margin: 0;
    background: #121212;
    color: #fff;
    font-family: sans-serif;
    display: flex;
    min-height: 100vh;
}

    flex-shrink: 0;
    background: #121212;
    display: flex;
}
.main-wrapper {
    display: flex;
    flex-direction: column;
    flex-grow: 1;
    background: #121212;
}
#header-slot {
    width: 100%;
    background: #121212;
}
.content-area {
    flex-grow: 1;
    padding: 40px;
    background: #121212;
    text-align: center;
}
.content-area h1 {
    color: #1e90ff;
    font-size: 36px;
    margin-bottom: 20px;
}
.artist-banner {
    width: 480px;
    max-width: 100%;
    height: auto;
    border-radius: 8px;
    display: block;
    margin: 0 auto 30px auto;
}
.video-container {
    position: relative;
    padding-bottom: 56.25%;
    height: 0;
    overflow: hidden;
    max-width: 800px;
    margin: 30px auto;
    background: #000;
    border-radius: 8px;
}
.video-container iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;

    width: 100%;
    background: #121212;
}
</style>
</head>
<body>

<!-- Sidebar Slot -->
<div id="sidebar-slot"></div>

<!-- Main Wrapper holding Header, Content, and Footer -->
<div class="main-wrapper">
    <!-- Header Slot -->
    <div id="header-slot"></div>

    <!-- Main Content Area -->
    <div class="content-area">
        <h1>Ruebengotxi</h1>
        
        <img src="../../images/ruebengotxi.png" alt="Ruebengotxi" class="artist-banner">

        <p style="font-size: 18px; color: #aaa; line-height: 1.6; max-width: 700px; margin: 0 auto 30px auto;">
            Experience the vibrant energy and incredible acoustic talent of Ruebengotxi performing live on the streets.
        </p>

        <!-- Featured Performance Video -->
        <div class="video-container">
            <iframe width="560" height="315" src="https://www.youtube.com/embed/UCE89rmKVwX9-tbIYUErQ_ow" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
    </div>

    <!-- Footer Slot -->
    <div id="footer"></div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    // Fetch and insert sidebar
    fetch('../sidewalk-sidebar.html')
        .then(response => response.text())
        .then(data => { document.getElementById('sidebar-slot').innerHTML = data; })
        .catch(error => console.error('Error loading sidebar:', error));

    // Fetch and insert header
    fetch('../sidewalk-header.html')
        .then(response => response.text())
        .then(data => { document.getElementById('header-slot').innerHTML = data; })
        .catch(error => console.error('Error loading header:', error));

    // Fetch and insert footer, then execute counter logic
    fetch('../sidewalk-footer.html')
        .then(r => r.text())
        .then(html => {
            document.getElementById('footer').innerHTML = html;
            const domain = window.location.hostname.replace(/\./g, "_");
            const page = window.location.pathname.replace(/\//g, "_") || "home";
            const counterKey = "pv_" + domain + "_" + page;
            let views = localStorage.getItem(counterKey);
            views = views ? parseInt(views) + 1 : 1;
            localStorage.setItem(counterKey, views);
            const counterEl = document.getElementById("viewCounter");
            if (counterEl) {
                counterEl.innerText = "Views: " + views;
            }
        })
        .catch(err => console.error("Footer failed to load:", err));
});
</script>

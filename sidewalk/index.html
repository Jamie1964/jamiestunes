<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>jamiestunes.com - Sidewalk Artists</title>
<style>

.content-area {

}
.artist-section {
    margin: 40px auto;
    max-width: 600px;
}
.artist-section a {
    text-decoration: none;
}
.artist-section img {
    width: 640px;
    max-width: 100%;
    height: auto;
    border-radius: 8px;
    display: block;
    margin: 0 auto 15px auto;
}
.artist-section h2 {
    color: gold;
    font-size: 28px;
    margin: 0;
}
.artist-section h2:hover {
    text-decoration: underline;

    width: 100%;

</style>
</head>
<body>

<!-- Sidebar Slot -->
<div id="sidebar-slot"></div>

<!-- Main Wrapper holding Header, Content, and Footer -->
<div class="main-wrapper">
    <!-- Header Slot -->
    <div id="header-slot"></div>

    <!-- Main Content Area -->
    <div class="content-area">
        <img src="../images/sidewalk-logo.jpg" alt="Sidewalk Artists" style="width: 640px; max-width: 100%; height: auto; margin-bottom: 30px;">
        
        <h1>Sidewalk Artists</h1>
        <p style="font-size: 18px; color: #aaa; line-height: 1.6; margin-bottom: 40px;">
            Discover raw, captivating acoustic performances and incredible talent captured right out on the streets and sidewalks.
        </p>

        <!-- Leire Artist Section -->
        <div class="artist-section">
            <a href="https://jamiestunes.com/sidewalk/leire/index.html">
                <img src="https://jamiestunes.com/images/leire-banner.jpg" alt="Leire" style="width: 640px; max-width: 100%; height: auto; border-radius: 8px; display: block; margin: 0 auto 15px auto;">
                <h2>Leire</h2>
            </a>
        </div>

        <hr style="border: 0; border-top: 1px solid #333; margin: 50px auto; max-width: 600px;">

        <!-- Luke Silva Artist Section -->
        <div class="artist-section">
            <a href="https://jamiestunes.com/sidewalk/lukesilva/index.html">
                <img src="https://jamiestunes.com/images/lukesilva-banner.jpg" alt="Luke Silva" style="width: 640px; max-width: 100%; height: auto; border-radius: 8px; display: block; margin: 0 auto 15px auto;">
                <h2>Luke Silva</h2>
            </a>
        </div>

        <hr style="border: 0; border-top: 1px solid #333; margin: 50px auto; max-width: 600px;">

        <!-- Crash Adams Artist Section -->
        <div class="artist-section">
            <a href="https://jamiestunes.com/sidewalk/crashadams/index.html">
                <img src="https://jamiestunes.com/images/crashadams-banner.jpg" alt="Crash Adams" style="width: 640px; max-width: 100%; height: auto; border-radius: 8px; display: block; margin: 0 auto 15px auto;">
                <h2>Crash Adams</h2>
            </a>
        </div>

        <hr style="border: 0; border-top: 1px solid #333; margin: 50px auto; max-width: 600px;">

        <!-- Dovydas Artist Section -->
        <div class="artist-section">
            <a href="https://jamiestunes.com/sidewalk/dovydas/index.html">
                <img src="https://jamiestunes.com/images/dovydas-banner.jpg" alt="Dovydas">
                <h2>Dovydas</h2>
            </a>
        </div>

        <hr style="border: 0; border-top: 1px solid #333; margin: 50px auto; max-width: 600px;">

        <!-- Karolina Protsenko Artist Section -->
        <div class="artist-section">
            <a href="https://jamiestunes.com/sidewalk/karolinaprotsenko/index.html">
                <img src="https://jamiestunes.com/images/karolina-banner.jpg" alt="Karolina Protsenko" style="width: 416px; max-width: 100%; height: auto; border-radius: 8px; display: block; margin: 0 auto 15px auto;">
                <h2>Karolina Protsenko</h2>
            </a>
        </div>

    </div>

    <!-- Footer Slot -->
    <div id="footer"></div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    // Fetch and insert sidebar
    fetch('sidewalk-sidebar.html')
        .then(response => response.text())
        .then(data => { document.getElementById('sidebar-slot').innerHTML = data; })
        .catch(error => console.error('Error loading sidebar:', error));

    // Fetch and insert header
    fetch('sidewalk-header.html')
        .then(response => response.text())
        .then(data => { document.getElementById('header-slot').innerHTML = data; })
        .catch(error => console.error('Error loading header:', error));

    // Fetch and insert footer, then execute counter logic
    fetch('sidewalk-footer.html')
        .then(r => r.text())
        .then(html => {
            document.getElementById('footer').innerHTML = html;
            const domain = window.location.hostname.replace(/\./g, "_");
            const page = window.location.pathname.replace(/\//g, "_") || "home";
            const counterKey = "pv_" + domain + "_" + page;
            let views = localStorage.getItem(counterKey);
            views = views ? parseInt(views) + 1 : 1;
            localStorage.setItem(counterKey, views);
            const counterEl = document.getElementById("viewCounter");
            if (counterEl) {
                counterEl.innerText = "Views: " + views;
            }
        })
        .catch(err => console.error("Footer failed to load:", err));
});
</script>

</body>

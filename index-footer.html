<div style="background: #121212; padding: 30px; text-align: center; color: #888; font-family: sans-serif;">
    <p>&copy; 2026 jamiestunes.com. All rights reserved.</p>
    <p>Page Views: <span id="visitor-counter" style="color: gold;">0</span></p>
    <p style="font-size: 12px; margin-top: 10px;">Last updated: August 28, 2026 — 12:10 PM MDT</p>
</div>

<script>
    (function() {
        const counterKey = 'jamiestunes_home_views';
        let views = localStorage.getItem(counterKey);
        views = views ? parseInt(views, 10) + 1 : 1;
        localStorage.setItem(counterKey, views);
        
        const counterElement = document.getElementById('visitor-counter');
        if (counterElement) {
            counterElement.textContent = views;
        }
    })();
</script>

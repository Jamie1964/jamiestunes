<!-- https://jamiestunes.com/children/graystones.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>jamiestunes.com - Children Artists</title>
    <style>
        body {
            margin: 0;
            background: #121212;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            min-height: 100vh;
        }
        #sidebar-slot {
            flex-shrink: 0;
            background: #121212;
            display: flex;
        }
        .main-wrapper {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            background: #121212;
        }
        #header-slot {
            width: 100%;
            background: #121212;
        }
        .content-area {
            flex-grow: 1;
            padding: 40px;
            background: #121212;
            text-align: center;
        }
        .content-area h1 {
            color: #1e90ff;
        }
        .section-block {
            margin: 30px auto;
            max-width: 600px;
        }
        .section-block h2 a {
            color: gold;
            text-decoration: none;
        }
        .section-block h2 a:hover {
            text-decoration: underline;
        }
        .section-block p {
            color: #ccc;
            font-size: 16px;
            line-height: 1.5;
        }
        #footer {
            width: 100%;
            background: #121212;
        }
    </style>
</head>
<body>

    <!-- Sidebar Slot -->
    <div id="sidebar-slot"></div>

    <!-- Main Wrapper holding Header, Content, and Footer -->
    <div class="main-wrapper">
        <!-- Header Slot -->
        <div id="header-slot"></div>

        <!-- Main Content Area -->
        <div class="content-area">
            <img src="../images/children-logo.jpg" alt="Children Artists" style="width: 640px; max-width: 100%; height: auto; margin-bottom: 30px;">
            <h1>Children Artists</h1>
            <p style="font-size: 18px; color: #aaa; margin-bottom: 40px;">Enjoy delightful musical performances and wholesome entertainment tailored specially for younger audiences and families.</p>

            <div class="section-block">
                <h2>Coming Soon</h2>
                <p>We are currently building out our collection of children's musical performances and artist archives. Check back soon!</p>
            </div>
        </div>

        <!-- Footer Slot -->
        <div id="footer"></div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Fetch and insert sidebar
            fetch('children-sidebar.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('sidebar-slot').innerHTML = data;
                })
                .catch(error => console.error('Error loading sidebar:', error));

            // Fetch and insert header
            fetch('children-header.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('header-slot').innerHTML = data;
                })
                .catch(error => console.error('Error loading header:', error));

            // Fetch and insert footer, then execute counter logic
            fetch('children-footer.html')
                .then(r => r.text())
                .then(html => {
                    document.getElementById('footer').innerHTML = html;

                    // NOW the footer exists — safe to run the counter
                    const domain = window.location.hostname.replace(/\./g, "_");
                    const page = window.location.pathname.replace(/\//g, "_") || "home";
                    const counterKey = "pv_" + domain + "_" + page;

                    let views = localStorage.getItem(counterKey);
                    views = views ? parseInt(views) + 1 : 1;
                    localStorage.setItem(counterKey, views);

                    const counterEl = document.getElementById("viewCounter");
                    if (counterEl) {
                        counterEl.innerText = "Views: " + views;
                    }
                })
                .catch(err => console.error("Footer failed to load:", err));
        });
    </script>
</body>
</html>
